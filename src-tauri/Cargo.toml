[package]
name = "kredr"
version = "0.3.0"
description = "Schlanke Arbeitsfläche für Claude-Code-Agenten"
license = "GPL-3.0-only"
repository = "https://github.com/SirKashij/Kredr"
edition = "2021"

[lib]
name = "kredr_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
ignore = "0.4"
tauri-plugin-single-instance = "2"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
# Dieselbe Fassung, die Tauri ohnehin mitbringt.
windows = { version = "0.62", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
