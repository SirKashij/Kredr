name: Prüfen

on:
  pull_request:
  push:
    branches: [main]

# Bewusst ohne cancel-in-progress: Beim Umsetzen eines Specs landet jeder Ticket-Merge als eigener
# Push im Integrationszweig, und jeder braucht ein eigenes Ergebnis. Abgebrochene Läufe haben in
# Version 1 einen wiederkehrend roten Test drei Stunden lang wie Zufall aussehen lassen.

# Das Prüfen liest nur. Der Token des Laufs darf deshalb nichts schreiben,
# auch nicht bei Pull Requests aus Forks.
permissions:
  contents: read

jobs:
  pruefen:
    # Kredr läuft nur unter Windows; die Tests des Kerns starten echte PowerShell.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Dieselbe Prüfkette wie lokal; die Schritte stehen in scripts/check.mjs.
      - name: Prüfen
        run: npm run check
