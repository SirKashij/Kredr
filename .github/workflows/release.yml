name: Release

# Baut den Installer aus dem Tag und legt ein Release als Entwurf an.
# Ablauf: docs/agents/release.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Bauen liest nur. Schreiben darf allein der Job, der das Release anlegt.
permissions:
  contents: read

jobs:
  bauen:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tag und Version vergleichen
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} passt nicht zur Version $version in package.json."
          }

      - name: Installer bauen
        run: npm run tauri build

      - name: Installer hochladen
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  veroeffentlichen:
    needs: bauen
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: installer

      # Als Entwurf: Text und Vorabversion setzt die Person, bevor sie es veröffentlicht.
      - name: Release als Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" installer/*-setup.exe
          --repo "${{ github.repository }}" --draft --generate-notes
          --title "Kredr ${GITHUB_REF_NAME#v}"
